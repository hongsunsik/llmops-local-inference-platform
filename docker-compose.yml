services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      # On macOS Docker Desktop, this reaches Ollama running on the host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen3:8b}
      CODER_MODEL: ${CODER_MODEL:-qwen3-coder:30b}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-glm-4.7-flash:latest}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-120}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-4}
      MLFLOW_TRACING_ENABLED: "true"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: local-llmops-gateway
      TRACE_CONTENT_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      mlflow:
        condition: service_started

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "${MLFLOW_HOST_PORT:-5000}:5000"
    environment:
      # MLflow 3.5+ validates the Host header against this allowlist; the gateway
      # reaches this container as "mlflow" over the Docker network, not localhost.
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*
    volumes:
      - ./mlflow-data:/mlflow

  prometheus:
    image: prom/prometheus:v3.0.1
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway

  # Speech-to-text for the voice-assistant demo (Korean-capable, multilingual
  # faster-whisper). Exposes an OpenAI-compatible /v1/audio/transcriptions API.
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    ports:
      - "${SPEACHES_HOST_PORT:-8000}:8000"
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub

  # Chat UI for the voice-assistant demo. It talks to the gateway as its only
  # model backend (not directly to Ollama), so routing/fallback/metrics still
  # apply, and to speaches for Korean speech-to-text.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "${OPEN_WEBUI_HOST_PORT:-3001}:8080"
    environment:
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URLS: http://gateway:8080/v1
      OPENAI_API_KEYS: sk-local-demo
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://speaches:8000/v1
      AUDIO_STT_OPENAI_API_KEY: does-not-matter-but-not-empty
      # "small" rather than "medium": the whole Compose stack shares Docker
      # Desktop's ~8GB VM budget, and "medium" in float32 (this CPU image has
      # no fp16 support) got OOM-killed (exit 137) under that budget.
      AUDIO_STT_MODEL: Systran/faster-whisper-small
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - gateway
      - speaches

volumes:
  hf-hub-cache:
  open-webui-data:
